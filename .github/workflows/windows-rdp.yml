name: Ubuntu Cloud SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Update System & Allow SSH Firewall
        run: |
          sudo apt update -y
          sudo apt install -y curl ufw
          sudo ufw allow 22/tcp
          echo "Firewall configured to allow SSH."
          sudo apt update && sudo apt upgrade -y
          sudo apt install xfce4 xfce4-goodies -y
          sudo apt install xrdp -y
          sudo systemctl status xrdp
          sudo adduser xrdp ssl-cert
          echo "xfce4-session" > ~/.xsession
          sudo systemctl restart xrdp
          sudo ufw allow from <trusted_IP_address> to any port 3389
          sudo ufw enable
          
          

      - name: 2. Create Admin Account
        run: |
          # ساخت کاربر جدید با همان نام و رمز قبلی
          sudo useradd -m -s /bin/bash nvadmin || echo "User already exists"
          echo "nvadmin:P@ssw0rd1qazXSW@#" | sudo chpasswd
          sudo usermod -aG sudo nvadmin
          # اجازه‌ی اجرای دستورات بدون پسورد (مشابه ادمین ویندوز)
          echo "nvadmin ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/nvadmin
          echo "Admin user 'nvadmin' created successfully."

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # نصب Tailscale روی اوبونتو (روش رسمی)
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt update -y
          sudo apt install tailscale -y

          # اتصال به شبکه‌ی Tailscale با کلید احراز هویت
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-ubuntu-server" --accept-routes

          sleep 5

          # دریافت آی‌پی اختصاصی Tailscale
          ts_ip=$(sudo tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "  >>> SSH SERVER IS READY! <<<" | tee -a
          echo "  Tailscale IP : $ts_ip"
          echo "  Username     : nvadmin"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  >> Open your SSH client and connect to: $ts_ip"
          echo "  >> Command: ssh nvadmin@$ts_ip"
          echo "=================================================="

      - name: 4. Keep Server Alive (6 Hours - GitHub Limit)
        run: |
          # حلقه‌ای به تعداد دقیقه‌های مجاز (۳۶۰ دقیقه = ۶ ساعت، چون محدودیت گیت‌هاب همین است)
          for ((i=1; i<=360; i++)); do
            sleep 60
            echo "[$i/360] Server running..."
          done
